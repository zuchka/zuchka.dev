<!doctype html>
<!--
  POST TEMPLATE — copy this file into site/writing/, rename it
  YYYY-MM-DD-slug.html, and fill in the placeholders below.

  Placeholders to replace:
    {{TITLE}}           — post title (also goes in <title> and <h1>)
    {{DESCRIPTION}}     — meta description, used by social previews
    {{DATE_HUMAN}}      — e.g. "May 6, 2026"
    {{DATE_ISO}}        — e.g. "2026-05-06"
    {{KIND}}            — "essay" or "notes"
    {{READING_MINS}}    — rough reading time, e.g. "4"
    {{POST_BODY}}       — the actual post (use <h2>, <p>, <pre>, etc.)
    {{PREV_HREF}}       — previous post href (or remove the prev nav block)
    {{PREV_TITLE}}      — previous post title
    {{NEXT_HREF}}       — next post href (or remove the next nav block)
    {{NEXT_TITLE}}      — next post title

  After publishing:
    1. Add a <li> row to /site/writing/index.html in date order.
    2. Add an <item> entry to /site/rss.xml.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}} — zuchka.dev</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="alternate" type="application/rss+xml" title="zuchka.dev — writing" href="/rss.xml" />
</head>
<body>
  <div class="layout">

    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="wordmark" href="/">zuchka.dev</a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="/projects/">Projects</a>
          <a href="/writing/" aria-current="location">Writing</a>
          <a href="/about.html">About</a>
          <a href="/now.html">Now</a>
        </nav>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false" hidden>Dark mode</button>
      </div>
    </header>

    <main class="main" id="main" tabindex="-1">

      <article class="post">

        <section class="hero">
          <div class="post-meta-top">
            <time datetime="{{DATE_ISO}}">{{DATE_HUMAN}}</time>
            <span class="sep">·</span>
            <span class="kind">{{KIND}}</span>
            <span class="sep">·</span>
            <span>{{READING_MINS}} min read</span>
          </div>
          <h1>{{TITLE}}</h1>
        </section>

        <section class="post-body">

          {{POST_BODY}}

        </section>

        <nav class="post-nav">
          <a class="post-nav-prev" href="{{PREV_HREF}}">
            <span class="post-nav-label">← previous</span>
            <span class="post-nav-title">{{PREV_TITLE}}</span>
          </a>
          <a class="post-nav-next" href="{{NEXT_HREF}}">
            <span class="post-nav-label">next →</span>
            <span class="post-nav-title">{{NEXT_TITLE}}</span>
          </a>
        </nav>

      </article>

    </main>
    <footer class="page-foot">
      <div class="footer-inner">
        <span>© 2026 Matt Abrams</span>
        <nav aria-label="Footer">
          <a href="https://github.com/zuchka">GitHub</a>
          <a href="https://www.linkedin.com/in/matt-abrams-86732b1a4/">LinkedIn</a>
          <a href="mailto:matt.j.abrams@gmail.com">Email</a>
          <a href="/rss.xml">RSS</a>
          <a href="https://github.com/zuchka/zuchka.dev">Site source</a>
        </nav>
      </div>
    </footer>
  </div>
        <script src="/theme.js"></script>
</body>
</html>
