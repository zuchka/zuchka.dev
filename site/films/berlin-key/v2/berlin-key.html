<body>
  <main aria-label="The Berlin key animation">
    <div id="stage">
      <article class="card scene-first" aria-label="The Berlin key" aria-describedby="description">
        <h1><span id="lead"></span><br><mark id="focus"></mark></h1>
        <div class="demonstration">
          <svg id="film" viewBox="0 316 1080 593" role="img" aria-labelledby="description"></svg>
        </div>
        <div class="takeaway" id="details">
          <figure>
            <svg id="study" aria-hidden="true"></svg>
            <figcaption id="study-label"></figcaption>
          </figure>
          <div class="notes"><strong id="part"></strong><p id="caption"></p></div>
        </div>
        <footer><span id="bolt-state"></span><span id="key-state"></span></footer>
      </article>
    </div>
    <p class="sr-only" id="description"></p>
    <section class="controls transport" aria-label="Film controls">
      <div class="timeline"><input type="range" id="scrub" min="0" step="10" value="0" aria-label="Film position"><output id="clock" for="scrub"></output></div>
      <div class="buttons">
        <button id="play" type="button">Play</button>
        <button id="slow" type="button" aria-pressed="false">½ speed</button>
        <select id="chapter" aria-label="Jump to chapter"></select>
      </div>
    </section>
  </main>
</body>
